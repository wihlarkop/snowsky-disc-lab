name: Firmware-free synthetic runtime

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/synthetic-runtime.yml
      - scripts/ci/qemu_runtime_build.py
      - scripts/ci/fixtures/mips32le_execution_smoke.c
      - scripts/ci/fixtures/mips32le_posix_mqueue.c
      - scripts/ci/fixtures/mips32le_posix_ipc_handoff.c
      - scripts/ci/fixtures/mips32le_posix_ipc_supervision.c
      - src/snowsky_disc_lab/synthetic_runtime.py
      - src/snowsky_disc_lab/synthetic_ipc_handoff.py
      - src/snowsky_disc_lab/synthetic_ipc_supervision.py
      - tests/test_synthetic_runtime.py
      - tests/test_synthetic_ipc_handoff.py
      - tests/test_synthetic_ipc_supervision.py
      - scripts/ci/fixtures/mips32le_synthetic_ui.c
      - src/snowsky_disc_lab/synthetic_ui.py
      - tests/test_synthetic_ui.py
      - docs/synthetic-runtime.md
      - docs/v257-runtime-capability-map.md
      - docs/m1-01-runtime-preparation.json

permissions:
  contents: read

jobs:
  synthetic-runtime:
    if: >-
      (github.event_name == 'pull_request' &&
       github.repository == 'wihlarkop/snowsky-disc-lab' &&
       github.event.pull_request.head.repo.full_name == 'wihlarkop/snowsky-disc-lab' &&
       (github.event.pull_request.head.ref == 'codex/m1-bounded-supervision' ||
        github.event.pull_request.head.ref == 'codex/m1-runtime-repro-wsl2' ||
        github.event.pull_request.head.ref == 'codex/m2-synthetic-ui-acceptance')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.repository == 'wihlarkop/snowsky-disc-lab' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build pinned QEMU once and execute filesystem, queue handoff, supervision and UI acceptance
        run: python3 scripts/ci/qemu_runtime_build.py session
