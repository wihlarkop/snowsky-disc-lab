name: Firmware-free QEMU runtime build

on:
  pull_request:
    branches:
      - codex/m1-extraction-toolchain-readiness
      - main
    paths:
      - .github/workflows/qemu-runtime-build.yml
      - scripts/ci/qemu_runtime_build.py
      - docs/m1-01-runtime-preparation.json
      - docs/M1-07-WINDOWS-WSL2-VALIDATION.md
      - docs/ROADMAP.md

permissions:
  contents: read

jobs:
  qemu-runtime-build:
    if: >-
      github.event.pull_request.head.repo.full_name == 'wihlarkop/snowsky-disc-lab' &&
      (
        (github.event.pull_request.head.ref == 'codex/firmware-free-qemu-runtime-build' &&
         github.event.pull_request.base.ref == 'codex/m1-extraction-toolchain-readiness') ||
        (github.event.pull_request.head.ref == 'codex/m1-runtime-repro-wsl2' &&
         github.event.pull_request.base.ref == 'main')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check runner capacity, verify pinned sources and build QEMU and shims
        run: python3 scripts/ci/qemu_runtime_build.py build
